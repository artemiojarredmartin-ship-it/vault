<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkpoint — supportive accountability</title>
  <meta name="description" content="An open-source accountability app built on a supportive communication climate: goals, check-ins, and partner feedback that helps people learn instead of hide.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f6fed'/><path d='M28 52l14 14 30-32' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#dashboard" class="brand" data-nav="dashboard">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span class="brand-text">Checkpoint</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#dashboard" data-nav="dashboard">Today</a>
        <a href="#goals" data-nav="goals">Goals</a>
        <a href="#checkins" data-nav="checkins">Check-ins</a>
        <a href="#partners" data-nav="partners">Partners</a>
        <a href="#learn" data-nav="learn">Learn</a>
        <a href="#settings" data-nav="settings">Settings</a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <!-- rendered by js/app.js -->
    <noscript>
      <p class="card">Checkpoint needs JavaScript to run. Your data never leaves your browser.</p>
    </noscript>
  </main>

  <footer class="site-footer wrap">
    <p>
      Checkpoint is open source (MIT). Your data is stored only in this browser.
      Built on the idea that <em>systems shape communication climate</em>.
    </p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
