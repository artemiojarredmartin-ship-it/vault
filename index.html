<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vault — bet on yourself</title>
  <meta name="description" content="Bet on yourself. Set a goal, stake credits, prove you did it. Miss it and the stake is locked in your Vault, not lost: earn it back with a harder challenge. We never keep your money.">
  <meta name="theme-color" content="#2f6fed">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232f6fed'/><rect x='22' y='42' width='56' height='40' rx='8' fill='white'/><path d='M34 42v-8a16 16 0 0 1 32 0v8' stroke='white' stroke-width='9' fill='none' stroke-linecap='round'/><circle cx='50' cy='62' r='6' fill='%232f6fed'/></svg>">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#today" class="brand" data-nav="today">
        <span class="brand-mark" aria-hidden="true">🔒</span>
        <span class="brand-text">Vault</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#today" data-nav="today">Today</a>
        <a href="#bets" data-nav="bets">Bets</a>
        <a href="#vault" data-nav="vault">Vault</a>
        <a href="#ledger" data-nav="ledger">Ledger</a>
        <a href="#learn" data-nav="learn">Learn</a>
        <a href="#settings" data-nav="settings">Settings</a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <noscript><p class="card">Vault needs JavaScript. Your data never leaves your browser.</p></noscript>

  <div id="sheet-root"></div>

  <footer class="site-footer wrap">
    <p><strong>We never keep your money.</strong> Missed stakes are locked, not lost. Open source (MIT). Phase 0 uses play credits only; everything is stored in this browser.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/feedback.js"></script>

  <script src="js/app.js"></script>
